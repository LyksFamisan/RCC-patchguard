# Free compute + an external durable Neon Free database. No paid disk.
services:
  - type: web
    name: rcc-patchguard-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Render.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PATCHGUARD_ADMIN_EMAIL
        sync: false
      - key: PATCHGUARD_ADMIN_PASSWORD
        sync: false
      - key: PATCHGUARD_REQUIRE_POSTGRES
        value: "1"
      - key: PATCHGUARD_REMOTE_JOBS
        value: "0"
